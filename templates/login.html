<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Electrons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full px-6">
        <div class="text-center mb-10">
            <div class="flex justify-center mb-4">
                <div class="w-12 h-12 border-2 border-white rounded-full flex items-center justify-center">
                    <div class="w-6 h-6 bg-white rounded-full"></div>
                </div>
            </div>
            <h1 class="logo-font text-4xl font-semibold">electrons</h1>
            <p class="text-gray-400 mt-2">Sign in to continue</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash p-4 mb-6 rounded-2xl {{ 'bg-green-500/20 text-green-400' if category == 'success' else 'bg-red-500/20 text-red-400' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm mb-2">Email</label>
                <input type="email" name="email" required 
                       class="w-full px-5 py-4 bg-zinc-900 border border-white/20 rounded-2xl focus:border-white">
            </div>
            <div>
                <label class="block text-sm mb-2">Password</label>
                <input type="password" name="password" required 
                       class="w-full px-5 py-4 bg-zinc-900 border border-white/20 rounded-2xl focus:border-white">
            </div>

            <button type="submit" 
                    class="btn-primary w-full py-4 text-lg font-semibold rounded-2xl">
                Log In
            </button>
        </form>

        <div class="text-center mt-8">
            <p class="text-gray-400">
                Don't have an account? 
                <a href="{{ url_for('signup_page') }}" class="text-white hover:underline">Create Account</a>
            </p>
        </div>
    </div>

</body>
</html>
