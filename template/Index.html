<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrons - Share Your Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-black text-white min-h-screen">

    <div class="max-w-7xl mx-auto px-6 py-24 grid md:grid-cols-2 gap-16 items-center min-h-screen">
        
        <!-- Left Side - Introduction -->
        <div class="space-y-8">
            <h1 class="logo-font text-6xl md:text-7xl font-bold leading-none">
                WHERE<br>ELECTRONS<br>COME ALIVE
            </h1>
            <p class="text-xl text-gray-400 max-w-lg">
                A community platform for makers, engineers, and innovators to share their open-source electronics and software projects.
            </p>
            <p class="text-gray-500">
                Built for passionate creators from Bihar and beyond.
            </p>
        </div>

        <!-- Right Side - Action Buttons -->
        <div class="flex flex-col gap-6">
            <a href="{{ url_for('signup_page') }}" 
               class="btn-primary text-center py-6 text-xl font-semibold rounded-3xl">
                Create Account
            </a>
            <a href="{{ url_for('login_page') }}" 
               class="btn-secondary text-center py-6 text-xl font-semibold rounded-3xl">
                Log In
            </a>
        </div>
    </div>

</body>
</html>
